// flutter_star_prnt_plus/android/build.gradle  (PLUGIN)

plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "io.eddayy.flutter_star_prnt"
    compileSdk 36

    defaultConfig {
        minSdk 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    // lintOptions (viejo) -> lint { ... } (nuevo)
    lint { disable += ["InvalidPackage"] }
}

// 👇 No fijes kotlin-stdlib con versión antigua (lo aporta el plugin de Kotlin).
//    Quita jcenter; el root ya declara google() y mavenCentral().
dependencies {
    implementation "androidx.annotation:annotation:1.8.0"
    implementation "com.starmicronics:stario:2.11.1"
    implementation "com.starmicronics:starioextension:1.15.1"
    // Si realmente necesitas coroutines, súbelas a una versión moderna:
    // implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
}
